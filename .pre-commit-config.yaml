# Os hooks rodam as mesmas versões do extra dev do pyproject.toml, pelo uv, e
# o job quality do CI (tests.yml) roda os mesmos comandos.
# Instalação: uv run --extra dev pre-commit install
# Os hooks disparam com mudanças em src/, tests/ e example/. Os workflows de
# .github/workflows/ não têm hook: o passo zizmor do job quality os confere, e
# o comando dele roda também na máquina local.
# O hook pytest roda a suíte sem os testes lentos, em menos de um minuto; a
# suíte completa fica para o CI e para `uv run --extra dev pytest`.
files: ^(src|tests|example)/
repos:
  - repo: local
    hooks:
      # Como no CI, a formatação de example/ não é conferida; o motivo está no
      # passo Ruff format de tests.yml.
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        exclude: ^example/
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run --extra dev ruff check --force-exclude
        language: system
        # jupyter inclui os notebooks de example/, que o ruff confere.
        types_or: [python, pyi, jupyter]
        require_serial: true

      # ty resolve os imports dos extras opcionais, por isso eles vão junto.
      - id: ty
        name: ty check
        entry: >-
          uv run --extra dev --extra all --extra search-all --extra polars
          --extra excel --extra codex ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: uv run --extra dev vulture
        language: system
        types_or: [python]
        pass_filenames: false

      - id: deptry
        name: deptry
        entry: >-
          uv run --extra dev --extra all --extra search-all --extra polars
          --extra excel --extra codex deptry src
        language: system
        pass_filenames: false

      # Fora ficam os testes que somam cerca de 70% do tempo da suíte: os que
      # sobem outros processos Python (test_assinatura_estavel.py e o teste do
      # PYTHONHASHSEED de test_conditional.py) e os do backend Codex
      # (test_codex.py e test_codex_runtime.py). O CI roda todos.
      - id: pytest-rapido
        name: pytest (rápido)
        entry: >-
          uv run --extra dev pytest -q -x -p no:cacheprovider
          --ignore=tests/test_assinatura_estavel.py
          --ignore=tests/test_codex.py
          --ignore=tests/test_codex_runtime.py
          --deselect=tests/test_conditional.py::test_ordem_de_execucao_nao_depende_do_hash_seed
        language: system
        pass_filenames: false
