[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataframeit"
version = "0.9.0"
description = "Enrich DataFrames with LLM-based text analysis. Extract structured information from text with Pydantic."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Bruno da Cunha de Oliveira" }
]
maintainers = [
    { name = "Bruno da Cunha de Oliveira" }
]
keywords = [
    "dataframe",
    "llm",
    "nlp",
    "pandas",
    "pydantic",
    "langchain",
    "gemini",
    "text-extraction",
    "structured-output",
    "data-enrichment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    # Menores versões com que a suíte passa, conferidas pelo job lowest-direct
    # do CI (tests.yml). langchain < 1.2.11 fixa langgraph < 1.1, que quebra no
    # import com o langgraph-prebuilt atual; pydantic < 2.11 falha nos testes;
    # pandas < 2.1.2 é instalado com numpy 2, com que é binariamente incompatível.
    "langchain>=1.2.11",
    "langchain-core>=1.2.10",
    "pandas>=2.1.2",
    "pydantic>=2.11.0",
    "tqdm>=4.1.0",
]

[project.optional-dependencies]
google = [
    "langchain-google-genai>=2.1.11",
]
openai = [
    "langchain-openai>=0.3.34",
]
anthropic = [
    "langchain-anthropic>=0.3.21",
]
groq = [
    "langchain-groq>=1.0.0",
]
claude-code = [
    "claude-agent-sdk>=0.1.48",
]
codex = [
    "filelock>=3.13",
    "openai-codex==0.1.0b3",
    # The SDK pins the exact runtime; this lower bound exposes its pre-release marker to uv.
    "openai-codex-cli-bin>=0.137.0a4",
]
polars = [
    "polars>=0.20",
    "pyarrow>=10",
]
excel = [
    "openpyxl>=3.1",
]
search = [
    "langchain-tavily>=0.2.12",
]
search-exa = [
    "langchain-exa>=1.0.0",
]
search-all = [
    "langchain-tavily>=0.2.12",
    "langchain-exa>=1.0.0",
]
all = [
    "langchain-google-genai>=2.1.11",
    "langchain-openai>=0.3.34",
    "langchain-anthropic>=0.3.21",
    "langchain-groq>=1.0.0",
    "langchain-tavily>=0.2.12",
    "langchain-exa>=1.0.0",
    "claude-agent-sdk>=0.1.48",
    "polars>=0.20",
    "pyarrow>=10",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.16,<0.17",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-static-i18n>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/bdcdo/dataframeit"
Documentation = "https://bdcdo.github.io/dataframeit/en/"
Repository = "https://github.com/bdcdo/dataframeit.git"
Issues = "https://github.com/bdcdo/dataframeit/issues"
Changelog = "https://github.com/bdcdo/dataframeit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataframeit"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Os testes usam Optional[X] e Union[X, Y] de propósito: typing.Union e o
# types.UnionType de `X | None` passam por ramos diferentes em utils.py, e
# reescrever as anotações deixaria o ramo de typing.Union sem cobertura.
"tests/**" = ["UP007", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
