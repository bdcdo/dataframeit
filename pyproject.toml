[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataframeit"
version = "0.10.0"
description = "Enrich DataFrames with LLM-based text analysis. Extract structured information from text with Pydantic."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Bruno da Cunha de Oliveira" }
]
maintainers = [
    { name = "Bruno da Cunha de Oliveira" }
]
keywords = [
    "dataframe",
    "llm",
    "nlp",
    "pandas",
    "pydantic",
    "langchain",
    "polars",
    "openai",
    "gemini",
    "anthropic",
    "claude",
    "web-search",
    "tavily",
    "exa",
    "text-extraction",
    "structured-output",
    "data-enrichment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    # Menores versões com que a suíte passa, conferidas pelo job lowest-direct
    # do CI (tests.yml). langchain < 1.2.11 fixa langgraph < 1.1, que quebra no
    # import com o langgraph-prebuilt atual; pydantic < 2.11 falha nos testes;
    # pandas < 2.1.2 é instalado com numpy 2, com que é binariamente incompatível.
    "langchain>=1.2.11",
    "langchain-core>=1.2.10",
    "pandas>=2.1.2",
    "pydantic>=2.11.0",
    "tqdm>=4.1.0",
]

[project.optional-dependencies]
google = [
    "langchain-google-genai>=2.1.11",
]
openai = [
    "langchain-openai>=0.3.34",
]
anthropic = [
    "langchain-anthropic>=0.3.21",
]
groq = [
    "langchain-groq>=1.0.0",
]
claude-code = [
    "claude-agent-sdk>=0.1.48",
]
codex = [
    "filelock>=3.13",
    "openai-codex==0.1.0b3",
    # The SDK pins the exact runtime; this lower bound exposes its pre-release marker to uv.
    "openai-codex-cli-bin>=0.137.0a4",
]
polars = [
    "polars>=0.20",
    "pyarrow>=10",
]
excel = [
    "openpyxl>=3.1",
]
search = [
    "langchain-tavily>=0.2.12",
]
search-exa = [
    "langchain-exa>=1.0.0",
]
search-all = [
    "langchain-tavily>=0.2.12",
    "langchain-exa>=1.0.0",
]
all = [
    "langchain-google-genai>=2.1.11",
    "langchain-openai>=0.3.34",
    "langchain-anthropic>=0.3.21",
    "langchain-groq>=1.0.0",
    "langchain-tavily>=0.2.12",
    "langchain-exa>=1.0.0",
    "claude-agent-sdk>=0.1.48",
    "polars>=0.20",
    "pyarrow>=10",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.16,<0.17",
    "ty==0.0.84",
    "vulture>=2.16,<3",
    "deptry>=0.25,<0.26",
    "pre-commit>=4.6,<5",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-static-i18n>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/bdcdo/dataframeit"
Documentation = "https://brunodcdo.com.br/dataframeit/en/"
Repository = "https://github.com/bdcdo/dataframeit.git"
Issues = "https://github.com/bdcdo/dataframeit/issues"
Changelog = "https://github.com/bdcdo/dataframeit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataframeit"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflitam com o ruff format, que decide vírgula final e concatenação.
    "COM812",
    "ISC001",
    # Docstring de classe sem linha em branco antes (D211) e resumo na primeira
    # linha (D212), o estilo que as docstrings do pacote já seguem.
    "D203",
    "D213",
    # O modo imperativo do D401 é conferido contra verbos em inglês e acusa toda
    # docstring em português; D413 pede linha em branco depois da última seção,
    # que nenhuma docstring do pacote usa.
    "D401",
    "D413",
    # O projeto não põe aviso de copyright em cada arquivo; a licença é o LICENSE.
    "CPY001",
    # O ruff format cuida do comprimento; o que sobra são strings e URLs longas.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# core.py imprime de propósito as estatísticas de uso e o aviso de workers
# reduzidos, que o usuário lê no fim da execução.
"src/dataframeit/core.py" = ["T201"]
# __all__ segue a ordem da API pública: a função dataframeit, os utilitários e
# as exceções, e não a ordem alfabética.
"src/dataframeit/__init__.py" = ["RUF022"]
# Os testes usam Optional[X] e Union[X, Y] de propósito: typing.Union e o
# types.UnionType de `X | None` passam por ramos diferentes em utils.py, e
# reescrever as anotações deixaria o ramo de typing.Union sem cobertura.
"tests/**" = [
    "UP007",
    "UP045",
    # assert é a forma do pytest.
    "S101",
    # Os valores esperados ficam literais no teste, onde são lidos.
    "PLR2004",
    # Funções de teste, fixtures e dublês dispensam anotação e docstring.
    "ANN",
    "D",
    # Dublês e fixtures repetem a assinatura que substituem, mesmo sem usar
    # todos os argumentos, e os testes chamam APIs com booleanos posicionais.
    "ARG",
    "FBT",
    # Os testes exercitam funções e atributos privados do pacote.
    "SLF001",
    # O pytest coleta tests/ como módulos soltos, sem pacote.
    "INP001",
    # Os dublês de exceção têm nome em português, e o nome da classe entra no
    # texto que errors.py classifica; um sufixo Error mudaria esse texto.
    "N818",
]

[tool.ruff.lint.flake8-annotations]
# *args e **kwargs repassados a outra API ficam com Any, o tipo de quem os recebe.
allow-star-arg-any = true

[tool.ruff.lint.flake8-unused-arguments]
# **kwargs nos provedores de busca recebe os parâmetros dos outros provedores,
# que a interface comum repassa a todos.
ignore-variadic-names = true

[tool.ruff.lint.flake8-type-checking]
# O Pydantic resolve as anotações dos modelos em tempo de execução, então os
# imports usados nelas não podem ir para um bloco TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ty.src]
include = ["src"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.deptry]
known_first_party = ["dataframeit"]
# Ferramentas de desenvolvimento e da documentação, que o código não importa.
optional_dependencies_dev_groups = ["dev", "docs"]

[tool.deptry.per_rule_ignores]
# Dependências que o código não importa pelo nome: as integrações LangChain de
# cada provider são carregadas por importlib (errors.validate_provider_dependencies
# e init_chat_model), pyarrow e openpyxl são usados pelo pandas ao ler e gravar
# parquet e xlsx, e openai-codex-cli-bin traz o executável do runtime do Codex.
DEP002 = [
    "langchain-google-genai",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-groq",
    "pyarrow",
    "openpyxl",
    "openai-codex-cli-bin",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source_pkgs = ["dataframeit"]
# Caminhos relativos à raiz do repositório, para que os arquivos de dados de
# jobs diferentes do CI se combinem num só relatório.
relative_files = true

[tool.coverage.paths]
# O pacote é importado de src/ (instalação editável e pythonpath do pytest);
# uma instalação comum o traria de site-packages, que conta como o mesmo código.
source = ["src/dataframeit", "*/site-packages/dataframeit"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
