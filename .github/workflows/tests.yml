name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ty e deptry resolvem os imports dos extras opcionais, e por isso o job
  # instala todos eles, inclusive o codex, cujo módulo o ty confere contra o SDK.
  quality:
    runs-on: ubuntu-latest
    env:
      EXTRAS: --extra dev --extra all --extra search-all --extra polars --extra excel --extra codex
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Ruff format
        run: uv run --python 3.13 $EXTRAS ruff format --check src tests

      - name: Ruff check
        run: uv run --python 3.13 $EXTRAS ruff check src tests

      - name: ty
        run: uv run --python 3.13 $EXTRAS ty check

      - name: vulture
        run: uv run --python 3.13 $EXTRAS vulture

      - name: deptry
        run: uv run --python 3.13 $EXTRAS deptry src

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # A instalação base não traz nada do extra codex. No extra dev, o filelock
      # chega pelo virtualenv do pre-commit, e só o SDK e o runtime são conferidos.
      - name: Verify Codex remains optional
        run: |
          uv run --python "${{ matrix.python-version }}" python -c '
          from importlib.metadata import distributions
          installed = {d.metadata["Name"].lower() for d in distributions()}
          assert not {"filelock", "openai-codex", "openai-codex-cli-bin"} & installed'
          uv run --python "${{ matrix.python-version }}" --extra dev python -c '
          from importlib.metadata import distributions
          installed = {d.metadata["Name"].lower() for d in distributions()}
          assert not {"openai-codex", "openai-codex-cli-bin"} & installed'

      # Todos os extras menos o codex, que tem job próprio. Os dados de cobertura
      # de cada job vão para o job coverage, que os combina e exige 100%; aqui
      # cada job cobre só a sua parte, e o limite fica desligado.
      - name: Run tests
        env:
          COVERAGE_FILE: .coverage.unit-${{ matrix.python-version }}
        run: >-
          uv run --python "${{ matrix.python-version }}"
          --extra dev --extra all --extra search-all
          pytest --cov=dataframeit --cov-branch --cov-report= --cov-fail-under=0

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: .coverage.unit-${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error

  # Instala cada dependência direta na menor versão que o pyproject.toml aceita,
  # resolvendo cada conjunto de extras à parte: num lock universal, um extra
  # pode subir o piso de uma dependência base (claude-agent-sdk puxa pydantic
  # >= 2.12) e esconder um piso quebrado. Uma dependência transitiva na versão
  # mais alta ainda pode subir um piso direto, como o langgraph faz com o
  # langchain-core. Roda em 3.10 porque o pandas no piso não tem wheel para 3.13.
  lowest-direct:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ['', 'all excel polars search-all']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Run tests
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          flags="--extra dev"
          for extra in $EXTRAS; do flags="$flags --extra $extra"; done
          uv pip compile pyproject.toml $flags --resolution lowest-direct --python-version 3.10 -o "$RUNNER_TEMP/requisitos.txt"
          uv venv --python 3.10 "$RUNNER_TEMP/venv"
          export VIRTUAL_ENV="$RUNNER_TEMP/venv"
          uv pip install -r "$RUNNER_TEMP/requisitos.txt"
          uv pip install --no-deps -e .
          "$VIRTUAL_ENV/bin/python" -m pytest

  codex-provider:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Run tests with the Codex SDK and bundled runtime
        env:
          COVERAGE_FILE: .coverage.codex-${{ matrix.python-version }}
        run: >-
          uv run --python "${{ matrix.python-version }}"
          --extra dev --extra codex
          pytest --cov=dataframeit --cov-branch --cov-report= --cov-fail-under=0

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-codex-${{ matrix.python-version }}
          path: .coverage.codex-${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error

  # Cobertura de ramos de src/dataframeit somada dos jobs unit e codex-provider,
  # nas duas versões de Python. O fail_under = 100 do pyproject.toml vale aqui.
  coverage:
    needs: [unit, codex-provider]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and check coverage
        run: |
          uv run --python 3.13 --extra dev coverage combine
          uv run --python 3.13 --extra dev coverage report

  codex-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Verify bundled runtime and portable authentication lifecycle
        run: >-
          uv run --python 3.13 --extra dev --extra codex pytest
          tests/test_codex.py::TestBackendLifecycle
          tests/test_codex_runtime.py

  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Build documentation
        run: uv run --python 3.13 --extra docs mkdocs build
